[csvtab]
back-color = 16777215              ; RGB(255, 255, 255)
back-color-dark = 2105376          ; RGB(32, 32, 32)
back-color2 = 15790320             ; RGB(240, 240, 240)
back-color2-dark = 3421236         ; RGB(52, 52, 52)
column-delimiter = "	"          ; Used when copy rows. Default is TAB
copy-column = 0                    ; Ctrl + C: 0 - copy a current cell, 1 - copy all cells from selected rows/current column
current-cell-back-color = 10903622 ; RGB(70, 96, 166)
current-cell-back-color-dark = 4079136 ; RGB(32, 62, 62)
decimal-align = 1                  ; 0/1, align mixed integers/floats at decimal position
default-column-delimiter =         ; Initial CSV delimiter: empty=Auto, or one char such as ; , | : or TAB
                                   ; Click "Delimiter" in the status bar to change it for the open document
detect-string = MULTIMEDIA & (ext="CSV" | ext="TAB" | ext="TSV")
disable-grid-lines = 0             ; 0/1, Disable/Enable grid lines
disable-np-keys = 0                ; 0/1, Disable/Enable N(ext) and P(revious) keys
disable-num-keys = 0               ; 0/1, Disable/Enable 1-8 keys
exit-by-q = 0                      ; Exit by Q-key
filter-align = 0                   ; -1 - left, 0 - center, 1 - right
filter-back-color = 15790320       ; RGB(240, 240, 240)
filter-back-color-dark = 3947580   ; RGB(60, 60, 60)
filter-case-sensitive = 0          ; 0/1
filter-row = 1                     ; 0/1
filter-text-color = 0              ; RGB(0, 0, 0)
filter-text-color-dark = 16777215  ; RGB(255, 255, 255)
language = Auto                    ; Auto/German/English/Ukrainian/Russian/SimplifiedChinese/TraditionalChinese

; Below params can be changed only in the ini file  
font = Arial                       ;
font-size = 10                     ;
font-weight = 0                    ; 0 - by system choice. Should be between 1 and 9
header-back-color = 13421772       ; RGB(204, 204, 204)
header-back-color-dark = 3947580   ; RGB(60, 60, 60)
header-row = 1                     ; 0/1
header-text-color = 0              ; RGB(0, 0, 0)
header-text-color-dark = 16777215  ; RGB(255, 255, 255)
line-number-back-color = 15132390  ; RGB(230, 230, 230)
line-number-back-color-dark = 3158064  ; RGB(48, 48, 48)
line-number-text-color = 8421504   ; RGB(128, 128, 128)
line-number-text-color-dark = 10395294 ; RGB(158, 158, 158)
allColumnsToMaxWidth = 0           ; 0/1, measure all visible rows and bypass automatic width limits
max-column-samples = 1000          ; maximum rows measured per column
max-column-width = 300             ; with exactly 2 columns, only the first is limited
max-file-size = 40000000           ; Maximum file size in bytes. Use 0 for unlimited
selection-back-color = 6956042     ; RGB(10, 36, 106)
selection-back-color-dark = 6710856    ; RGB(72, 102, 102)
selection-text-color = 16777215    ; RGB(255, 255, 255)
selection-text-color-dark = 14474460   ; RGB(220, 220, 220)
show-line-numbers = 0              ; 0/1, Show a separate row-number column on the left
skip-comments = 3                  ; Initial comment mode: 0=parse, 1=show without parsing, 2=hide, 3=auto preamble
start-mode = default               ; Startup mode: default / editor / transformer

; Colors
; Light theme
text-color = 0                     ; RGB(0, 0, 0)

; Dark theme
text-color-dark = 14474460         ; RGB(220, 220, 220)
theme-mode = tc                    ; tc/light/dark, follow Total Commander or force light/dark
trim-values = 1                    ; Remove spaces and TABs at the beginning and end of values
